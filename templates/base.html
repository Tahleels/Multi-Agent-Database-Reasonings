<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI BI Dashboard{% endblock %}</title>
    
    <!-- CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/main.css" rel="stylesheet">
    <link href="/static/css/components.css" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Sidebar -->
    {% include 'components/sidebar.html' %}

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Modals -->
    {% include 'components/modals.html' %}

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/navigation.js"></script>
    <!--<script src="/static/js/chat.js"></script>-->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/connections.js"></script>
    <script src="/static/js/agents.js"></script>
    
    
    {% block extra_js %}<script>
    // Your existing code...


    // Debug: Bootstrap check
    console.log("Bootstrap:", bootstrap);
    console.log("Dropdown:", bootstrap?.Dropdown);
    console.log("Ver:", bootstrap?.Tooltip?.VERSION);
</script>{% endblock %}
</body>
</html>
